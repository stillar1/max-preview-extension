<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link href="libs/luckysheet/plugins/css/pluginsCss.css" rel="stylesheet">
    <link href="libs/luckysheet/css/luckysheet.css" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    </style>
</head>
<body>
    <div id="luckysheet" style="margin:0px;padding:0px;position:absolute;width:100%;height:100%;left: 0px;top: 0px;"></div>
    
    <script src="libs/luckysheet/plugins/js/plugin.js"></script>
    <script src="libs/luckysheet/luckysheet.umd.js"></script>
    <script>
        window.addEventListener('message', (event) => {
            if (event.data.action === 'loadExcel') {
                try { window.luckysheet.destroy(); } catch(e) {}
                window.luckysheet.create({
                    container: 'luckysheet',
                    data: event.data.sheets,
                    title: event.data.title,
                    userInfo: event.data.userInfo,
                    showinfobar: false,
                    lang: 'ru'
                });
            }
        });
    </script>
</body>
</html>
